services:
  postgres:
    image: postgres:16-alpine
    container_name: ctmss-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-ctmss}
    ports:
      - "5432:5432"
    volumes:
      - ctmss_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-ctmss}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ctmss_pgdata:
